name: astrbot_plugin_video_storyboard
display_name: 分段看视频
short_desc: 让机器人一段一段看完你的视频：分镜抽帧、字幕/语音转写、逐段点评。
desc: |
  让机器人“按段看完”一个本地视频：每一段做分镜抽帧、拼成九宫格，配上这一段的台词，
  再交给支持图片的对话模型写一段观后感，逐段推送，最后给整片总结与章节目录。

  特点：
  - 不限时长，按窗口滚动处理，可断点续看；
  - 台词优先读内嵌字幕，没有就 OCR 画面硬字幕，最后才用语音转写；
  - 支持 `/kv zoom 段 格` 对任意一格做二级特写，`/kv chapters`、`/kv jump`、`/kv ask` 回看与提问；
  - 视频可以放进指定文件夹用 `/kv 文件名` 打开，也可以直接在 QQ 里发给机器人；
  - 可把每段/整片分析写入“我会牢牢记住你”的长期记忆；
  - 参数可在插件页面的「参数设置」里热改，下一段生效。
